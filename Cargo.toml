[package]
name = "beatnet-rs"
version = "0.1.0"
edition = "2024"
description = "Synchronous streaming BeatNet beat and downbeat tracking"
license = "CC-BY-4.0"
repository = "https://github.com/coral/beatnet-rs"
documentation = "https://docs.rs/beatnet-rs"
keywords = ["audio", "beat-tracking", "tempo", "rhythm", "dsp"]
categories = ["multimedia::audio", "algorithms"]
include = [
    "src/**",
    "tests/**",
    "examples/**",
    "models/**",
    "assets/**",
    "tools/**",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "LICENSE",
]

[features]
default = ["bundled-runtime"]
bundled-runtime = ["ort/download-binaries", "ort/tls-native", "ort/copy-dylibs"]
dynamic-runtime = ["ort/load-dynamic"]
live = ["dep:cpal"]

[dependencies]
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "api-27"] }
realfft = "3.5"
rubato = "5.0"
audioadapter-buffers = "5.2"
rtrb = "0.4"
rand = "0.10.3"
rand_chacha = "0.10"
thiserror = "2"
cpal = { version = "0.18.2", optional = true }
fearless_simd = "1.0"
fearless_simd_macros = "0.1"

[dev-dependencies]
ctrlc = "3.5"

[[example]]
name = "live"
required-features = ["live"]

[profile.release]
lto = "thin"
codegen-units = 1
